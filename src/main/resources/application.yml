spring:
  application:
    name: backend
  profiles:
    default: local
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:}

app:
  jwt:
    issuer: ${JWT_ISSUER:shiftrhythm-api}
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT30M}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:P30D}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  documentai:
    endpoint: ${DOCUMENTAI_ENDPOINT:https://us-documentai.googleapis.com}
    project-number: ${DOCUMENTAI_PROJECT_NUMBER:437332095325}
    location: ${DOCUMENTAI_LOCATION:us}
    processor-id: ${DOCUMENTAI_PROCESSOR_ID:cbb47f2525db9dc0}
    quota-project: ${DOCUMENTAI_QUOTA_PROJECT:shiftmate-504210}
  openai:
    endpoint: ${OPENAI_ENDPOINT:https://api.openai.com}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.4-mini}
    ocr-enabled: ${OPENAI_OCR_ENABLED:false}
  gemini:
    endpoint: ${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
