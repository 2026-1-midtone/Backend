spring:
  application:
    name: backend
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:}

app:
  jwt:
    issuer: ${JWT_ISSUER:shiftrhythm-api}
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT30M}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:P30D}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
