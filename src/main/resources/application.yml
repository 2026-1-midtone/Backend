spring:
  application:
    name: backend
  profiles:
    # 프로파일을 지정하지 않은 배포는 인증이 켜진 prod로 뜬다.
    # 개발용 인증 우회는 SPRING_PROFILES_ACTIVE=local 을 명시할 때만 활성화된다.
    default: prod
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:shiftrhythm}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USER:shiftrhythm}
    password: ${MYSQL_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:}

app:
  jwt:
    issuer: ${JWT_ISSUER:shiftrhythm-api}
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT30M}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:P30D}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  documentai:
    endpoint: ${DOCUMENTAI_ENDPOINT:https://us-documentai.googleapis.com}
    project-number: ${DOCUMENTAI_PROJECT_NUMBER:437332095325}
    location: ${DOCUMENTAI_LOCATION:us}
    processor-id: ${DOCUMENTAI_PROCESSOR_ID:cbb47f2525db9dc0}
    quota-project: ${DOCUMENTAI_QUOTA_PROJECT:shiftmate-504210}
  openai:
    endpoint: ${OPENAI_ENDPOINT:https://api.openai.com}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.4-mini}
    ocr-enabled: ${OPENAI_OCR_ENABLED:false}
  gemini:
    endpoint: ${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
